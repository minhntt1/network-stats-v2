# ============================================================
# Netstats-common Testcontainers properties
# All constants used by the test MyBatis DB config live here so
# they can be tuned without touching Java code.
# ============================================================

# ---- Testcontainer: which MySQL image to spin up ----
db.container.image=mysql:8.4

# ---- Container database name (created at startup) ----
db.container.database=netstats

# ---- Schema/data init scripts (run in order at container start) ----
db.container.init.schema=db/schema.sql
db.container.init.data=db/data.sql

# ---- JDBC (statics only; host/port come from the running container) ----
db.driver.class=com.mysql.cj.jdbc.Driver
db.jdbc.params=connectionTimeZone=UTC

# ---- Runtime DB owner (created by the container) ----
db.runner.username=netstats
db.runner.password=netstats

# ---- Hikari pool (mirrors example Config.java) ----
db.pool.maximum.pool.size=10
db.pool.connection.timeout.millis=86400000
# Hikari transaction isolation string, e.g. TRANSACTION_READ_COMMITTED
db.pool.transaction.isolation=TRANSACTION_READ_COMMITTED
db.pool.auto.commit=false

# ---- MyBatis mapper locations (classpath pattern) ----
mybatis.mapper.locations=classpath:mapper/**/*.xml